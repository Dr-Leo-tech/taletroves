    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <title>Tale Trove - Read Story</title>
    <style>
        .story-container { max-width: 800px; margin: 40px auto; padding: 20px; }
        .chapter-list { margin-top: 30px; }
        .chapter-link { 
            display: block; 
            padding: 15px; 
            background: white; 
            margin-bottom: 10px; 
            border-radius: 8px; 
            text-decoration: none; 
            color: #333; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: 0.2s;
        }
        .chapter-link:hover { transform: translateX(10px); color: #667eea; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; }
        .comments-section { margin-top: 40px; }
        .comments-section h3 { color: #333; }
        .comment-form textarea { width: 100%; box-sizing: border-box; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; font-size: 1em; resize: vertical; }
        .comment-form button { margin-top: 8px; background: #667eea; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .comment-form button:disabled { opacity: 0.6; }
        .login-note { background: #f4f4f9; padding: 12px; border-radius: 8px; color: #555; }
        .comment-item { background: white; padding: 12px 15px; border-radius: 10px; margin-top: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .comment-head { font-size: 0.85em; color: #888; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 10px; }
        .comment-head a { color: #667eea; font-weight: bold; text-decoration: none; }
        .comment-body { white-space: pre-wrap; word-break: break-word; color: #333; }
        .comment-del { background: none; border: none; color: #c0392b; cursor: pointer; font-size: 0.85em; }
    </style>
</head>
<body>
    <div class="js-header"></div>

    <div class="story-container">
        <a href="Stories.html" class="back-link">← Back to Library</a>
        <h1 id="storyTitle">Loading story...</h1>
        <p id="storyMeta" style="color: #666; font-style: italic;"></p>
   <div class="interaction-bar">
    <button class="action-btn" onclick="handleInteraction('like')">❤️ Like</button>
    <button class="action-btn" onclick="handleInteraction('comment')">💬 Comment</button>
</div>
        
        <div class="chapter-list" id="chapterList">
            </div>

        <div class="comments-section" id="commentsSection">
            <h3 id="commentsHeading">💬 Comments</h3>
            <div id="commentFormBox"></div>
            <div id="commentList">Loading comments...</div>
        </div>
    </div>

    <div class="js-footer"></div>

    <script>
        const supabaseUrl = 'https://oadbiabeqavrvtymcvuv.supabase.co';
        const supabaseKey = 'sb_publishable_cQvpBFh00y0lujudlGhlJQ_ltN3ltN7';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

  async function loadStoryData() {
    const urlParams = new URLSearchParams(window.location.search);
    const storyId = urlParams.get('id')?.trim(); // Trim prevents accidental spaces

    if (!storyId) {
        console.error("No story ID found in URL");
        window.location.href = "stories.html";
        return;
    }

    console.log("Fetching data for Story ID:", storyId);

    // 1. Fetch Story Details
    const { data: story, error: sErr } = await supabaseClient
        .from('stories')
        .select('title, author_id, profiles(username)')
        .eq('id', storyId)
        .single();

    if (story) {
        document.getElementById('storyTitle').innerText = story.title;
        if (story.author_id) {
            document.getElementById('storyMeta').innerHTML =
                `By <a href="author.html?id=${story.author_id}" style="color:#667eea;text-decoration:none;">${story.profiles?.username || 'Unknown Author'}</a>`;
        }
    } else if (sErr) {
        console.error("Story Fetch Error:", sErr.message);
    }

    // 2. Fetch Chapters
    const { data: chapters, error: cErr } = await supabaseClient
        .from('chapters')
        .select('id, title, created_at')
        .eq('story_id', storyId)
        .order('created_at', { ascending: true });

    const list = document.getElementById('chapterList');
    
    if (cErr) {
        console.error("Chapter Fetch Error:", cErr.message);
        list.innerHTML = `<p style="color:red;">Database Error: ${cErr.message}</p>`;
        return;
    }

    if (chapters && chapters.length > 0) {
        list.innerHTML = chapters.map((ch, index) => `
            <a href="readchapter.html?id=${ch.id}" class="chapter-link">
                <strong>Chapter ${index + 1}:</strong> ${ch.title}
            </a>
        `).join('');
    } else {
        // If chapters are empty, check if RLS is the problem
        list.innerHTML = `
            <div style="background: #fff3cd; padding: 15px; border-radius: 8px; border: 1px solid #ffeeba;">
                <p><strong>No chapters found.</strong></p>
                <p style="font-size: 0.8em;">If you see chapters in Supabase, make sure you have added a <b>SELECT</b> policy for the 'chapters' table.</p>
            </div>
        `;
    }
}


   async function handleInteraction(type) {
        // Check if a user is logged in
        const { data: { user } } = await supabaseClient.auth.getUser();

        if (!user) {
            // Action for Guests
            alert(`Sign up for Tale Trove to ${type} on this story!`);
            window.location.href = "index.html";
            return;
        }

        // Action for Logged-in Users
        if (type === 'like') {
            await submitLike(user.id);
        } else {
            document.getElementById('commentsSection').scrollIntoView({ behavior: 'smooth' });
            document.getElementById('commentInput')?.focus();
        }
    }

    async function submitLike(userId) {
        const urlParams = new URLSearchParams(window.location.search);
        const storyId = urlParams.get('id');

        const { error } = await supabaseClient
            .from('likes')
            .insert([{ user_id: userId, story_id: storyId }]);

        if (error) {
            if (error.code === '23505') alert("You already liked this story!");
            else console.error(error);
        } else {
            alert("Story Liked!");
            location.reload(); // Refresh to update count
        }
    }

    // ---------- COMMENTS ----------
    let commentUser = null;
    const getStoryId = () => new URLSearchParams(window.location.search).get('id')?.trim();

    async function loadComments() {
        const storyId = getStoryId();
        const list = document.getElementById('commentList');
        const formBox = document.getElementById('commentFormBox');

        const { data: { user } } = await supabaseClient.auth.getUser();
        commentUser = user;

        if (user) {
            formBox.innerHTML = `
                <div class="comment-form">
                    <textarea id="commentInput" rows="3" maxlength="500" placeholder="Write a comment..."></textarea>
                    <button id="commentBtn" onclick="postComment()">Post Comment</button>
                </div>`;
        } else {
            formBox.innerHTML = `<div class="login-note">Please <a href="index.html">log in</a> to comment.</div>`;
        }

        const { data: comments, error } = await supabaseClient
            .from('comments')
            .select('id, user_id, content, created_at')
            .eq('story_id', storyId)
            .order('created_at', { ascending: false });

        if (error) { list.innerHTML = `<p style="color:red;">Could not load comments: ${error.message}</p>`; return; }

        document.getElementById('commentsHeading').innerText = `💬 Comments (${comments.length})`;
        if (!comments.length) { list.innerHTML = '<p style="color:#888;">No comments yet. Be the first!</p>'; return; }

        // Look up usernames for the commenters
        const ids = [...new Set(comments.map(c => c.user_id))];
        const { data: profs } = await supabaseClient.from('profiles').select('id, username').in('id', ids);
        const names = Object.fromEntries((profs || []).map(p => [p.id, p.username]));

        list.innerHTML = '';
        comments.forEach(c => {
            const item = document.createElement('div');
            item.className = 'comment-item';

            const head = document.createElement('div');
            head.className = 'comment-head';

            const left = document.createElement('span');
            const nameLink = document.createElement('a');
            nameLink.href = `author.html?id=${c.user_id}`;
            nameLink.textContent = names[c.user_id] || 'Reader';
            left.append(nameLink, ' · ' + new Date(c.created_at).toLocaleDateString());
            head.appendChild(left);

            if (commentUser && commentUser.id === c.user_id) {
                const del = document.createElement('button');
                del.className = 'comment-del';
                del.textContent = 'Delete';
                del.onclick = () => deleteComment(c.id);
                head.appendChild(del);
            }

            const body = document.createElement('div');
            body.className = 'comment-body';
            body.textContent = c.content;

            item.append(head, body);
            list.appendChild(item);
        });
    }

    async function postComment() {
        const input = document.getElementById('commentInput');
        const btn = document.getElementById('commentBtn');
        const text = input.value.trim();
        if (!text) return;

        btn.disabled = true;
        const { error } = await supabaseClient
            .from('comments')
            .insert([{ story_id: getStoryId(), user_id: commentUser.id, content: text }]);
        btn.disabled = false;

        if (error) { alert('Could not post comment: ' + error.message); return; }
        input.value = '';
        loadComments();
    }

    async function deleteComment(id) {
        if (!confirm('Delete this comment?')) return;
        const { error } = await supabaseClient.from('comments').delete().eq('id', id);
        if (error) { alert('Could not delete: ' + error.message); return; }
        loadComments();
    }

        window.onload = () => { loadStoryData(); loadComments(); };
    </script>
 <script type="module" src="main.js">
</script>
</body>
</html>
