<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reset Password - Tale Trove</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'Inter','Segoe UI',Roboto,Arial,sans-serif; background:linear-gradient(135deg,#f4effc 0%,#eef5fb 55%,#eaf7f6 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; padding:110px 16px 40px; color:#1f2430; }
    .card{ position:relative; width:100%; max-width:400px; background:#fff; border-radius:28px; padding:100px 32px 28px; box-shadow:0 18px 45px rgba(80,60,140,.16); }
    .logo-circle{ position:absolute; top:-78px; left:50%; transform:translateX(-50%); width:164px; height:164px; border-radius:50%; background:#fff; box-shadow:0 10px 28px rgba(80,60,140,.2); display:flex; align-items:center; justify-content:center; }
    .logo-circle img{ width:112px; height:auto; }
    h2{ text-align:center; margin:0 0 6px; }
    p.note{ text-align:center; color:#7b8190; font-size:14px; margin:0 0 14px; }
    input{ width:100%; border:none; border-bottom:1.5px solid #d9dce3; outline:none; font-size:16px; font-family:inherit; padding:12px 4px; margin-top:6px; }
    input:focus{ border-bottom-color:#7b3fd1; }
    button{ width:100%; margin-top:22px; padding:14px; border:none; border-radius:999px; background:linear-gradient(90deg,#8a2be2,#1d9bb5); color:#fff; font-size:17px; font-weight:600; font-family:inherit; cursor:pointer; box-shadow:0 8px 18px rgba(110,70,200,.25); }
    button:disabled{ opacity:.7; cursor:not-allowed; }
    a{ display:block; text-align:center; margin-top:16px; color:#1d9bb5; text-decoration:none; font-weight:500; }
    #msg{ text-align:center; margin-top:12px; font-size:14px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-circle"><img src="logo.png" alt="Tale Trove logo"></div>
    <h2>Set a new password</h2>
    <p class="note" id="note">Checking your reset link...</p>
    <div id="formBox" style="display:none;">
      <input type="password" id="newPass" placeholder="New password (min 6 characters)" autocomplete="new-password">
      <input type="password" id="newPass2" placeholder="Confirm new password" autocomplete="new-password">
      <button id="saveBtn" onclick="savePassword()">Save Password</button>
    </div>
    <div id="msg"></div>
    <a href="index.html">← Back to Log In</a>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseClient = supabase.createClient(
      'https://oadbiabeqavrvtymcvuv.supabase.co',
      'sb_publishable_cQvpBFh00y0lujudlGhlJQ_ltN3ltN7'
    );

    function showForm() {
      document.getElementById('note').innerText = 'Choose a new password for your account.';
      document.getElementById('formBox').style.display = 'block';
    }

    // Supabase fires PASSWORD_RECOVERY when the reset link is opened
    supabaseClient.auth.onAuthStateChange((event) => {
      if (event === 'PASSWORD_RECOVERY') showForm();
    });

    // If the link is invalid or expired, no recovery event arrives
    setTimeout(() => {
      if (document.getElementById('formBox').style.display === 'none') {
        document.getElementById('note').innerText = 'This reset link is invalid or has expired. Request a new one from the login page.';
      }
    }, 4000);

    async function savePassword() {
      const p1 = document.getElementById('newPass').value;
      const p2 = document.getElementById('newPass2').value;
      const msg = document.getElementById('msg');
      if (p1.length < 6) { msg.style.color = '#c0392b'; msg.innerText = 'Password must be at least 6 characters.'; return; }
      if (p1 !== p2) { msg.style.color = '#c0392b'; msg.innerText = 'Passwords do not match.'; return; }

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      const { error } = await supabaseClient.auth.updateUser({ password: p1 });
      btn.disabled = false;

      if (error) { msg.style.color = '#c0392b'; msg.innerText = error.message; return; }
      msg.style.color = '#1a8a4a';
      msg.innerText = 'Password updated! Redirecting...';
      await supabaseClient.auth.signOut();
      setTimeout(() => { window.location.href = 'index.html'; }, 1500);
    }
  </script>
</body>
</html>
